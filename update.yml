name: 银行股股价准实时更新

on:
  schedule:
    # A股交易时间（北京时间）：上午 09:30-11:30，下午 13:00-15:00
    # GitHub Actions 的 cron 使用 UTC（北京=UTC+8），以下为对应窗口，每 15 分钟触发一次
    - cron: "30-59 1 * * 1-5"   # 09:30-09:59 北京
    - cron: "0-59 2 * * 1-5"    # 10:00-10:59 北京
    - cron: "0-30 3 * * 1-5"    # 11:00-11:30 北京
    - cron: "0-59 5 * * 1-5"    # 13:00-13:59 北京
    - cron: "0-59 6 * * 1-5"    # 14:00-14:59 北京
    - cron: "0 7 * * 1-5"       # 15:00 收盘
  workflow_dispatch: {}          # 允许在 Actions 页面手动点一下立即运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 拉取最新股价并生成 prices.json
        run: node update.js
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== git status before add ==="
          git status --short
          echo "=== prices.json head ==="
          head -5 prices.json
          git add prices.json
          echo "=== git diff --cached stat ==="
          git diff --cached --stat || true
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动更新股价 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
            echo "已推送更新"
          fi
