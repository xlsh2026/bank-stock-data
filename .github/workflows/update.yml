name: 银行股股价准实时更新

on:
  push:
    paths:
      - '.github/workflows/update.yml'
      - 'update.js'
      - 'fundamentals.json'
  schedule:
    # 北京交易时段，每15分钟一次，避开午休 11:30-13:00
    - cron: "*/15 1-3 * * 1-5"   # 上午 北京 09:00-11:45
    - cron: "*/15 5-6 * * 1-5"   # 下午 北京 13:00-14:45
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 拉取最新股价并生成 prices.json
        run: node update.js
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动更新股价 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
